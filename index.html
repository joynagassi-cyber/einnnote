<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1C19" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Einnote — des notes qui obligent à l’apprentissage actif : Outline, Cornell, carte mentale et Zettelkasten, avec révision espacée. Tout reste sur l’appareil."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F766E'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23FFFDF8'%3E%C3%89%3C/text%3E%3C/svg%3E"
    />
    <title>Einnote — des notes qui font apprendre</title>
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair/sombre).
      (function () {
        try {
          var raw = localStorage.getItem("engram.settings.v1");
          var settings = raw ? JSON.parse(raw).state.settings : null;
          var theme =
            settings && settings.theme
              ? settings.theme
              : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          if (settings && settings.accent) root.dataset.accent = settings.accent;
          if (settings && settings.fontSize)
            root.style.setProperty("--note-size", settings.fontSize + "px");
          var ui = (settings && settings.personalization) || {};
          if (ui.density) root.dataset.density = ui.density;
          if (ui.radius) root.dataset.radius = ui.radius;
          if (ui.borders) root.dataset.borders = ui.borders;
          if (ui.elevation) root.dataset.elevation = ui.elevation;
          if (ui.paper) root.dataset.paper = ui.paper;
          if (ui.noteLeading)
            root.style.setProperty("--note-leading", ui.noteLeading + "px");
          if (ui.readingWidth)
            root.style.setProperty("--reading-width", ui.readingWidth + "px");
          if (ui.canvasStrength)
            root.style.setProperty("--canvas-strength", ui.canvasStrength / 100);
        } catch (e) {
          /* stockage indisponible : le thème clair s’applique par défaut */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
