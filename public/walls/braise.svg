<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="140" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.32" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#140A08" />
  <g filter="url(#soft)">
    <circle cx="320" cy="720" r="520" fill="#B4471F" opacity="0.85" />
    <circle cx="1180" cy="260" r="480" fill="#5E1A16" opacity="0.85" />
    <circle cx="880" cy="940" r="380" fill="#F08A3C" opacity="0.85" />
    <circle cx="1520" cy="820" r="420" fill="#2A0E0B" opacity="0.85" />
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay" />
  <rect width="1600" height="1000" fill="url(#vignette)" />
</svg>
