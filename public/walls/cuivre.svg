<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="140" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.32" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#150F0A" />
  <g filter="url(#soft)">
    <circle cx="320" cy="240" r="500" fill="#8C5326" opacity="0.85" />
    <circle cx="1240" cy="820" r="540" fill="#3E2A18" opacity="0.85" />
    <circle cx="860" cy="700" r="380" fill="#C08442" opacity="0.85" />
    <circle cx="1520" cy="140" r="400" fill="#1F150C" opacity="0.85" />
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay" />
  <rect width="1600" height="1000" fill="url(#vignette)" />
</svg>
