<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ramp" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(100 0.5 0.5)">
      <stop offset="0%" stop-color="#FDF4DC" />
      <stop offset="25%" stop-color="#FBE6B4" />
      <stop offset="50%" stop-color="#F6D08B" />
      <stop offset="75%" stop-color="#EFB878" />
      <stop offset="100%" stop-color="#E2A57F" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#ramp)" />
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.03" style="mix-blend-mode:overlay" />
</svg>
